<!DOCTYPE html>
<html>
<head>

    <title>Emotional Support Chatbot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/chatbot/style.css">

</head>
<body>

<div class="container mt-5">

    <div class="chat-container">

        <h2 class="text-center mb-4">Emotional Support Chatbot</h2>

        <div id="chat-box"></div>

        <div class="input-group mt-3">

            <input type="text" id="user-input" class="form-control" placeholder="Type your message...">

            <button class="btn send-btn" onclick="sendMessage()">
                Send
            </button>
                    </div>

    </div>

</div>

<script>

function sendMessage() {

    let userInput = document.getElementById('user-input').value;

    if(userInput.trim() === '') {
        return;
    }

    let chatBox = document.getElementById('chat-box');

    chatBox.innerHTML += `
        <div class="user-message">
            <strong>You:</strong> ${userInput}
        </div>
    `;

    fetch('/get-response/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
         body: `message=${userInput}`
    })
    .then(response => response.json())
    .then(data => {

        chatBox.innerHTML += `
            <div class="bot-message">
                <strong>Bot:</strong> ${data.response}
            </div>
        `;

        document.getElementById('user-input').value = '';

        chatBox.scrollTop = chatBox.scrollHeight;
    });
}

function getCookie(name) {
    let cookieValue = null;

    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');

        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
           }

    return cookieValue;
}

</script>

</body>
</html>
